<script>
const hash=(s)=>[...String(s)].reduce((h,c)=>Math.imul(h^c.charCodeAt(0),16777619)>>>0,2166136261);
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function torn(seed,{edges='tblr',amp=5,along=18}={}){const rnd=rng(hash(seed));const jag=(on)=>{if(!on)return 0;const bite=rnd()<.12?1.8:1;return Math.round(rnd()*amp*bite*10)/10};const pts=[];
const side=(n,on,at)=>{for(let i=0;i<n;i++)pts.push(at((i/n)*100+rnd()*(100/n)*.6,jag(on)))};
side(along,edges.includes('t'),(x,j)=>`${x.toFixed(1)}% ${j}px`);side(Math.round(along*1.5),edges.includes('r'),(y,j)=>`calc(100% - ${j}px) ${y.toFixed(1)}%`);
side(along,edges.includes('b'),(x,j)=>`${(100-x).toFixed(1)}% calc(100% - ${j}px)`);side(Math.round(along*1.5),edges.includes('l'),(y,j)=>`${j}px ${(100-y).toFixed(1)}%`);return`polygon(${pts.join(', ')})`}
